services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wellness
      # Parola .env'den; yoksa eski PC kurulumunun degeri (mevcut volume o parolayla olustu).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellness}
      POSTGRES_DB: wellness
    ports:
      # ZimaOS'ta 5433 dolu ve DB LAN'a acilmaz: .env'de DB_BIND=127.0.0.1:5434.
      - "${DB_BIND:-5433}:5432"
    volumes:
      - wellness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness"]
      interval: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://wellness:${POSTGRES_PASSWORD:-wellness}@db:5432/wellness
      API_TOKEN: ${API_TOKEN:-change-me}
      API_PORT: 3011
      # Ev YZ gecidi (ZimaOS yz-litellm, netmovies repo infra/yz): saglayici anahtari orada,
      # burada yalniz bu uygulamanin sanal anahtari. Gecit yoksa Eva telefonda bulut/Nano'ya duser.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://yz.evaitec.com:4000/v1}
      LLM_API_KEY: ${LLM_API_KEY:?YZ gecidinin wellness sanal anahtari}
      LLM_CHAT_MODEL: gemini-flash
      LLM_VISION_MODEL: gemini-flash
      OTA_DIR: /app/ota
      # Egzersiz katalogu: repodaki dosya dogrudan servis edilir (APK'siz guncelleme).
      EXERCISES_FILE: /app/data/exercises.json
      # Secici sayfasi: fit.evaitec.com/plan/
      PLAN_DIR: /app/plan
    volumes:
      # APK'lar (ops/publish_ota.mjs kopyalar). fit.evaitec.com/ota/ altindan servis edilir.
      - ./ota:/app/ota:ro
      - ./apps/web/src/data/exercises.json:/app/data/exercises.json:ro
      - ./tools/secici:/app/plan:ro
    ports:
      - "3011:3011"
    depends_on:
      db:
        condition: service_healthy

  # Ev disindan erisim: fit.evaitec.com hem PWA'yi hem API'yi bu konteynerden servis
  # eder. Kendi tuneli var, netmovies'inkine binmiyor: origin `http://localhost:3011`
  # (compose aginda `api` servisi), ve netmovies dustugunde Eva'nin
  # telefonla konusmasi etkilenmiyor.
  # Acmak icin: CF_TUNNEL_CREDENTIALS ver + `docker compose --profile tunnel up -d`
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wellness-tunnel
    restart: unless-stopped
    # UDP/QUIC bu makinede erisilebilir degil; TCP/HTTP2 ile baglan.
    command: tunnel --no-autoupdate --protocol http2 run
    volumes:
      - ./ops/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Tunelin kimligi. Repoda degil, cloudflared'in kendi dizininde durur.
      - ${CF_TUNNEL_CREDENTIALS:-/dev/null}:/etc/cloudflared/creds.json:ro
    depends_on:
      - api
    # Kendi ag alani, origin compose DNS'iyle `api`. Eskiden api'nin namespace'ini
    # paylasiyordu: api her yeniden kuruldugunda tunel olu namespace'e bagli kalip
    # 530 veriyordu (20 Eyl, iki kez).
    profiles:
      - tunnel

volumes:
  wellness_pgdata:

networks:
  default:
    # Sabit aralik: Docker havuzu tukenince 192.168.0.0/20 vermisti; ev agi (192.168.1.x)
    # onunla cakisti ve api YZ gecidine (192.168.1.186) EHOSTUNREACH aliyordu.
    ipam:
      config:
        # ZimaOS'ta 172.24.0.0/16 dolu (big-bear-minio): orada .env NET_SUBNET=10.42.10.0/24.
        - subnet: ${NET_SUBNET:-172.24.10.0/24}
