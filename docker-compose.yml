services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wellness
      POSTGRES_PASSWORD: wellness
      POSTGRES_DB: wellness
    ports:
      - "5433:5432"
    volumes:
      - wellness_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellness"]
      interval: 5s
      retries: 10

  # All provider keys live here, never in the app. The app only knows aliases.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./config/litellm.yaml:/app/config.yaml:ro
    environment:
      # Empty is allowed so `compose up db` still works; litellm itself fails loudly without it.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LLM_API_KEY:-proxy}
    ports:
      - "4000:4000"
    healthcheck:
      # The image has no wget/curl, only its own python.
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=3)"]
      interval: 10s
      retries: 12

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://wellness:wellness@db:5432/wellness
      API_TOKEN: ${API_TOKEN:-change-me}
      API_PORT: 3011
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_API_KEY: ${LLM_API_KEY:-proxy}
      LLM_CHAT_MODEL: wellness-chat
      LLM_VISION_MODEL: wellness-vision
      OTA_DIR: /app/ota
      # Egzersiz katalogu: repodaki dosya dogrudan servis edilir (APK'siz guncelleme).
      EXERCISES_FILE: /app/data/exercises.json
    volumes:
      # APK'lar (ops/publish_ota.mjs kopyalar). fit.evaitec.com/ota/ altindan servis edilir.
      - ./ota:/app/ota:ro
      - ./apps/web/src/data/exercises.json:/app/data/exercises.json:ro
    ports:
      - "3011:3011"
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_started

  # Ev disindan erisim: fit.evaitec.com hem PWA'yi hem API'yi bu konteynerden servis
  # eder. Kendi tuneli var, netmovies'inkine binmiyor: origin `http://localhost:3011`
  # (compose aginda `api` servisi), ve netmovies dustugunde Eva'nin
  # telefonla konusmasi etkilenmiyor.
  # Acmak icin: CF_TUNNEL_CREDENTIALS ver + `docker compose --profile tunnel up -d`
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: wellness-tunnel
    restart: unless-stopped
    # UDP/QUIC bu makinede erisilebilir degil; TCP/HTTP2 ile baglan.
    command: tunnel --no-autoupdate --protocol http2 run
    volumes:
      - ./ops/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Tunelin kimligi. Repoda degil, cloudflared'in kendi dizininde durur.
      - ${CF_TUNNEL_CREDENTIALS:-/dev/null}:/etc/cloudflared/creds.json:ro
    depends_on:
      - api
    # Kendi ag alani, origin compose DNS'iyle `api`. Eskiden api'nin namespace'ini
    # paylasiyordu: api her yeniden kuruldugunda tunel olu namespace'e bagli kalip
    # 530 veriyordu (20 Eyl, iki kez).
    profiles:
      - tunnel

volumes:
  wellness_pgdata:
