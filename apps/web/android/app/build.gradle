// Surum tek kaynak: git etiketi ile ayni tutulur (v0.10.0 -> 0.10.0).
// versionCode ondan turer; OTA katalogu guncellemeyi bu sayiyla anlar, sabit 1
// kalirsa yeni surum "zaten kurulu" gorunur.
// variables.gradle'da: saat APK'si de ayni sayiyi okuyor.
def appVersion = rootProject.ext.wellnessVersion

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.evaitec.wellness"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.evaitec.wellness"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.tokenize('.').with { it[0].toInteger() * 10000 + it[1].toInteger() * 100 + it[2].toInteger() }
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Saat modulu ile ayni OTA karar mantigi (wear/build.gradle'da da bagli).
    sourceSets {
        main.java.srcDirs += '../shared/src/main/java'
    }
    kotlin {
        jvmToolchain(21)
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    // APK adinda surum: yayindan inen dosyanin hangi surum oldugu adindan belli olsun.
    // Ad tek yerde uretilir - .github/workflows/apk.yml adi dosyadan okuyor, ikinci kez yazmiyor.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "wellness-${appVersion}.apk"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    testImplementation 'junit:junit:4.13.2'
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // HealthExtraPlugin: capacitor-health de ayni surumu getiriyor, burada acikca
    // bildiriliyor cunku kod bu modulde.
    implementation 'androidx.health.connect:connect-client:1.2.0-alpha01'
    // ActivityPlugin: Activity Recognition Transition API burada yasiyor. Alternatifi
    // ham ivmeolcerden kendi siniflandiricimizi yazmak - cok daha buyuk bakim yuzeyi
    // ve surekli sensor dinleme maliyeti (AGENTS.md, Sinirlar: yeni bagimlilik gerekcesi).
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    // WearBridgeService: saatten gelen olcumu Data Layer uzerinden alir. Saat modulu ile
    // ayni surum; alternatifi yok, Data Layer tek kapi.
    implementation 'com.google.android.gms:play-services-wearable:19.0.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
