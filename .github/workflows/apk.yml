name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node ops/gen_icons.mjs
      - run: npm run build -w @wellness/web
        env:
          WELLNESS_NATIVE: '1'
      - run: npx cap sync android
        working-directory: apps/web
      - run: ./gradlew testDebugUnitTest
        working-directory: apps/web/android
      - run: ./gradlew :wear:lintDebug
        working-directory: apps/web/android
      # Kalici debug imzasi. Aksi halde Gradle her kosuda yeni bir debug.keystore uretir
      # ve iki surum farkli sertifikayla imzalanir: cihaz yukseltmeyi
      # INSTALL_FAILED_UPDATE_INCOMPATIBLE ile reddeder, OTA hicbir zaman kurulamaz
      # (21 Eyl: 0.23 ve 0.24 wear APK'larinin sertifika SHA-256'lari farkli cikti).
      # ~/.android'e yazmak yetmedi (0.25.0 yine farkli sertifikayla cikti): imza
      # artik build.gradle'daki signingConfigs.debug uzerinden bu dosyaya bagli.
      - name: debug keystore
        run: |
          echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > apps/web/android/debug.keystore
          keytool -list -keystore apps/web/android/debug.keystore -storepass android | tail -1
      # Telefon ve saat **ayni kosuda** derleniyor: imzalar tutmazsa Data Layer
      # hata vermeden susar.
      - run: ./gradlew :app:assembleDebug :wear:assembleDebug
        working-directory: apps/web/android
      # evaitecOTA katalogu: her kalem bir uygulama. Kurulacak kalemi cagiran id ile secer,
      # sha256 burada hesaplaniyor - indirilen APK cihazda bununla dogrulanmadan kurulmuyor.
      - name: latest.json uret
        working-directory: apps/web/android
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*wellnessVersion = '\(.*\)'.*/\1/p" variables.gradle)
          code=$(echo "$version" | awk -F. '{print $1*10000+$2*100+$3}')
          # Dosya adi Gradle'da uretiliyor (app/build.gradle: wellness-<surum>.apk). Burada
          # yeniden yazilmiyor, bulunan dosyanin adi okunuyor - iki kaynak birbirinden kayamaz.
          phone=$(ls app/build/outputs/apk/debug/*.apk)
          wear=$(ls wear/build/outputs/apk/debug/*.apk)
          phone_apk=$(basename "$phone")
          wear_apk=$(basename "$wear")
          # Indirme adresi GitHub degil kendi sunucumuz: GitHub CDN 120 KB/s ile 13 MB'lik
          # saat APK'sini 2 dakikada veriyordu, saatin ekrani sonunce indirme kesiliyordu
          # (fit.evaitec.com olculen: 1.2 MB/s). APK'lar release'e de eklenir ama manifest
          # buraya bakar; dosyalar ota/ dizinine konur (depo bu makine, Dean 20 Eyl).
          base="https://fit.evaitec.com/ota"
          pkg=com.evaitec.wellness
          phone_sha=$(sha256sum "$phone" | cut -d' ' -f1)
          wear_sha=$(sha256sum "$wear" | cut -d' ' -f1)
          cat > apps.json <<JSON
          [
            {
              "id": "wellness-phone",
              "name": "Wellness (telefon)",
              "package": "$pkg",
              "versionCode": $code,
              "versionName": "$version",
              "apk": "$phone_apk",
              "url": "$base/$phone_apk",
              "sha256": "$phone_sha"
            },
            {
              "id": "wellness-wear",
              "name": "Wellness (saat)",
              "package": "$pkg",
              "versionCode": $code,
              "versionName": "$version",
              "apk": "$wear_apk",
              "url": "$base/$wear_apk",
              "sha256": "$wear_sha"
            }
          ]
          JSON
          # Eski sabit alanlar (evaglass UpdateChecker semasi) listeden TURETILIYOR - elle
          # ikinci kez yazilmiyor, iki kaynak birbirinden kayamaz.
          jq '(map(select(.id == "wellness-phone")) | first) as $p
            | (map(select(.id == "wellness-wear")) | first) as $w
            | {apps: ., versionCode: $p.versionCode, versionName: $p.versionName,
               apk: $p.apk, url: $p.url, sha256: $p.sha256,
               wearApk: $w.apk, wearUrl: $w.url, wearSha256: $w.sha256}' apps.json > latest.json
          rm apps.json
          # Turetme bozulursa yayin da bozulsun: sabit alanlar listeyle birebir ayni olmali.
          jq -e '(.apps | map(select(.id == "wellness-phone")) | first) as $p
            | (.apps | map(select(.id == "wellness-wear")) | first) as $w
            | .versionCode == $p.versionCode and .versionName == $p.versionName
              and .apk == $p.apk and .url == $p.url and .sha256 == $p.sha256
              and .wearApk == $w.apk and .wearUrl == $w.url and .wearSha256 == $w.sha256' latest.json > /dev/null
          cat latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: wellness-debug-apk
          path: |
            apps/web/android/app/build/outputs/apk/debug/*.apk
            apps/web/android/wear/build/outputs/apk/debug/*.apk
            apps/web/android/latest.json
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/web/android/app/build/outputs/apk/debug/*.apk
            apps/web/android/wear/build/outputs/apk/debug/*.apk
            apps/web/android/latest.json
