name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node ops/gen_icons.mjs
      - run: npm run build -w @wellness/web
      - run: npx cap sync android
        working-directory: apps/web
      - run: ./gradlew testDebugUnitTest
        working-directory: apps/web/android
      - run: ./gradlew :wear:lintDebug
        working-directory: apps/web/android
      # Telefon ve saat **ayni kosuda** derleniyor: CI'da debug keystore her kosuda
      # yeniden uretilebilir ve imzalar tutmazsa Data Layer hata vermeden susar.
      - run: ./gradlew :app:assembleDebug :wear:assembleDebug
        working-directory: apps/web/android
      # OTA katalogu: saat (ve ileride telefon) bu dosyayi okuyup guncellemeye karar veriyor.
      # sha256 burada hesaplaniyor - indirilen APK cihazda bununla dogrulanmadan kurulmuyor.
      - name: latest.json uret
        working-directory: apps/web/android
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*wellnessVersion = '\(.*\)'.*/\1/p" variables.gradle)
          code=$(echo "$version" | awk -F. '{print $1*10000+$2*100+$3}')
          phone=app/build/outputs/apk/debug/app-debug.apk
          wear=wear/build/outputs/apk/debug/wear-debug.apk
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          cat > latest.json <<JSON
          {
            "versionCode": $code,
            "versionName": "$version",
            "apk": "app-debug.apk",
            "url": "$base/app-debug.apk",
            "sha256": "$(sha256sum "$phone" | cut -d' ' -f1)",
            "wearApk": "wear-debug.apk",
            "wearUrl": "$base/wear-debug.apk",
            "wearSha256": "$(sha256sum "$wear" | cut -d' ' -f1)"
          }
          JSON
          cat latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: wellness-debug-apk
          path: |
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            apps/web/android/wear/build/outputs/apk/debug/wear-debug.apk
            apps/web/android/latest.json
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk
            apps/web/android/wear/build/outputs/apk/debug/wear-debug.apk
            apps/web/android/latest.json
