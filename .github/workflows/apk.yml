name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: node ops/gen_icons.mjs
      - run: npm run build -w @wellness/web
      - run: npx cap sync android
        working-directory: apps/web
      - run: ./gradlew testDebugUnitTest
        working-directory: apps/web/android
      - run: ./gradlew assembleDebug
        working-directory: apps/web/android
      - uses: actions/upload-artifact@v4
        with:
          name: wellness-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
